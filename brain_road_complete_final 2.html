for(const [r,l,a] of extraRequested)for(const x of a)if(!brains.some(b=>b.name===x[0]))brains.push({name:x[0],icon:x[1],price:x[2],income:x[3],chance:x[4],rarity:r,label:l});

const rarityRank={common:0,rare:1,epic:2,brainrotgod:3,secret:4,og:5,fusioncommon:0,fusionrare:1,fusionepic:2,fusiongod:3,fusionsecret:4};
let money=500,mutCollection={},luckyEnabled=false,luckyMultiplier=1,gameStarted=false,musicOn=false,audioContext=null,musicTimer=null,incomeTimer=null,spawnTimer=null,fusionSelected=[],fusionLuck=false,goldBoost=false,diamondBoost=false,rainbowBoost=false,realtimeAll=false,reverseCount=0,discovered={},firebaseLiveStarted=false,lastRealtimeEventId=null;
const $=id=>document.getElementById(id),key=(n,m)=>n+"@@"+m;
function load(){try{const s=JSON.parse(localStorage.getItem("brainRoadIntegratedSave")||"null");if(s){if(Number.isFinite(s.money))money=s.money;if(s.mutCollection)mutCollection=s.mutCollection;if(typeof s.luckyEnabled==="boolean")luckyEnabled=s.luckyEnabled;if(Number.isFinite(s.luckyMultiplier))luckyMultiplier=Math.max(1,s.luckyMultiplier);if(typeof s.fusionLuck==="boolean")fusionLuck=s.fusionLuck;if(typeof s.goldBoost==="boolean")goldBoost=s.goldBoost;if(typeof s.diamondBoost==="boolean")diamondBoost=s.diamondBoost;if(typeof s.rainbowBoost==="boolean")rainbowBoost=s.rainbowBoost;if(Number.isFinite(s.reverseCount))reverseCount=Math.min(10,Math.max(0,s.reverseCount));if(s.discovered)discovered=s.discovered}}catch(e){}}
function save(){localStorage.setItem("brainRoadIntegratedSave",JSON.stringify({money,mutCollection,luckyEnabled,luckyMultiplier,fusionLuck,goldBoost,diamondBoost,rainbowBoost,reverseCount,discovered}))}
function count(b,m){return mutCollection[key(b.name,m)]||0}
function add(b,m,n=1){const k=key(b.name,m);mutCollection[k]=(mutCollection[k]||0)+n}
function totalIncome(){let t=0;for(const k in mutCollection){const [n,m]=k.split("@@"),b=brains.find(x=>x.name===n);if(b)t+=b.income*mutations[m].mult*mutCollection[k]}return t}
function update(){$("money").textContent="💰 "+money.toLocaleString()+"円";$("income").textContent="+"+(totalIncome()*(reverseCount+1)).toLocaleString()+"円/秒";$("luckyStatus").textContent=luckyEnabled?"🍀 レア率 ×"+luckyMultiplier:"";$("luckyStatus").classList.toggle("active",luckyEnabled&&luckyMultiplier>1);renderCollection()}
function renderCollection(){const mut=$("mutTab").classList.contains("active"),box=$("cards");box.innerHTML="";for(const b of brains){if(!mut){let n=0;for(const m in mutations)n+=count(b,m);if(!n)continue;box.innerHTML+=`<div class="card"><div class="icon">${b.icon}</div><div>${b.name}</div><div>${b.label}</div><div>×${n}</div></div>`}else for(const m in mutations){let n=count(b,m);if(!n)continue;box.innerHTML+=`<div class="card"><div class="icon">${mutations[m].icon||b.icon}</div><div>${b.name}</div><div>${mutations[m].name}</div><div>×${n} / 収入×${mutations[m].mult}</div></div>`}}if(!box.children.length)box.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:12px;color:#aaa">まだ持っていません</div>'}
function renderBook(){const mut=$("bookMutTab").classList.contains("active"),g=$("bookGrid");g.innerHTML="";if(!mut){for(const b of brains){const found=b.rarity==="og"?!!discovered[b.name]:Object.keys(mutations).some(m=>count(b,m)>0)||!!discovered[b.name];g.innerHTML+=`<div class="bookCard ${found?"":"missing"}"><div class="big">${found?b.icon:"？"}</div><div>${b.name}</div><div>${b.label}${b.rarity==="og"?" / コンプリート対象外":""}</div></div>`}const target=brains.filter(b=>b.rarity!=="og");const done=target.every(b=>!!discovered[b.name]||Object.keys(mutations).some(m=>count(b,m)>0));if(done)g.innerHTML+=`<div style="grid-column:1/-1;text-align:center;padding:10px;color:#fde68a;font-weight:900">🎉 OG以外コンプリート！</div>`}else{for(const [m,v] of Object.entries(mutations)){const found=Object.keys(mutCollection).some(k=>k.endsWith("@@"+m)&&mutCollection[k]>0);g.innerHTML+=`<div class="bookCard ${found?"":"missing"}"><div class="big">${found?(v.icon||"🧠"):"？"}</div><div>${v.name}</div><div>${found?"×"+v.mult+" 収入":"未発見"}</div></div>`}}}
function audio(){if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==="suspended")audioContext.resume()}
function tone(f,d=.1,type="sine",v=.06){if(!audioContext)return;const o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+d);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+d)}
function toggleMusic(){audio();musicOn=!musicOn;if(musicTimer)clearInterval(musicTimer);if(musicOn){let a=[262,330,392,523,392,330],i=0;musicTimer=setInterval(()=>tone(a[i++%a.length],.18,"triangle",.03),260)}$("musicButton").textContent=musicOn?"🎵 BGM ON":"🔇 BGM OFF"}
function msg(t){$("message").textContent=t;setTimeout(()=>{if($("message").textContent===t)$("message").textContent=""},1400)}
function rareEffect(b){if(b.rarity==="og"){const e=$("effect");e.innerHTML="👑✨<br>OG!!<br>"+b.icon+" "+b.name+" 出現！！";e.className="showSecret";for(let i=0;i<18;i++){const q=document.createElement("span");q.textContent=i%2?"🎰":"🦉";q.style.position="absolute";q.style.left=(5+Math.random()*90)+"%";q.style.top=(10+Math.random()*80)+"%";q.style.fontSize="28px";$("game").appendChild(q);setTimeout(()=>q.remove(),1700)}setTimeout(()=>{e.className="";e.innerHTML=""},1800)}else if(b.rarity==="secret"||b.rarity==="fusionsecret"){const e=$("effect");e.innerHTML="🔴✨<br>SECRET!!<br>"+b.icon+" "+b.name+" 出現！";e.className="showSecret";setTimeout(()=>{e.className="";e.innerHTML=""},1800)}else if(b.rarity==="brainrotgod"||b.rarity==="fusiongod"){const e=$("effect");e.innerHTML="🟠⚡<br>BRAINROT GOD!!<br>"+b.icon+" "+b.name+" 出現！";e.className="showGod";setTimeout(()=>{e.className="";e.innerHTML=""},1400)}}
function chooseBrain(){let t=0;for(const b of brains)if(b.chance>0)t+=b.chance*(luckyEnabled&&rarityRank[b.rarity]>=1?luckyMultiplier:1);let r=Math.random()*t;for(const b of brains)if(b.chance>0){r-=b.chance*(luckyEnabled&&rarityRank[b.rarity]>=1?luckyMultiplier:1);if(r<=0)return b}return brains[0]}
function chooseMutation(){const w={normal:77,gold:15*(goldBoost?5:1),diamond:6*(diamondBoost?5:1),rainbow:2*(rainbowBoost?5:1)};let t=Object.values(w).reduce((a,b)=>a+b,0),r=Math.random()*t;for(const m of ["normal","gold","diamond","rainbow"]){r-=w[m];if(r<=0)return m}return "normal"}
function spawnBrain(forced=null,forcedMut=null){if(!gameStarted)return;const b=forced||chooseBrain(),m=forcedMut||chooseMutation(),el=document.createElement("div");el.className="brain "+b.rarity+" "+m;el.innerHTML=`<span class="price">💰 ${b.price.toLocaleString()}円</span><span class="label"><span class="name">${mutations[m].icon} ${b.name}</span><span class="rarity">${b.label} / ${mutations[m].name}</span></span><span>${b.icon}</span>`;let x=-120;el.style.left=x+"px";$("game").appendChild(el);if(b.rarity==="secret"||b.rarity==="brainrotgod"||b.rarity==="og")rareEffect(b);let dead=false;function move(){if(!el.isConnected||dead)return;x+=2.2;el.style.left=x+"px";if(x>innerWidth+120){dead=true;el.remove();return}requestAnimationFrame(move)}function buy(){audio();if(dead||!el.isConnected)return;if(money<b.price){msg("💸 "+b.name+" は "+b.price.toLocaleString()+"円 必要！");return}money-=b.price;add(b,m);discovered[b.name]=true;dead=true;el.remove();tone(660,.08);setTimeout(()=>tone(880,.12),70);msg(`${mutations[m].icon} ${b.name} GET！`);update();save()}el.onclick=buy;el.ontouchstart=e=>{e.preventDefault();buy()};requestAnimationFrame(move)}
function openFusion(){fusionSelected=[];$("fusionPanel").style.display="block";renderFusionChoices()}
function renderFusionChoices(){const box=$("fusionChoices");box.innerHTML="";for(const b of brains){if(b.rarity==="og")continue;const n=Object.keys(mutations).reduce((s,m)=>s+count(b,m),0);if(!n)continue;const selected=fusionSelected.filter(x=>x===b.name).length;const btn=document.createElement("button");btn.className="fusionChoice"+(selected?" selected":"");btn.innerHTML=`${b.icon} ${b.name}<br><small>${b.label} / 所持×${n} / 選択×${selected}</small>`;btn.onclick=()=>{if(fusionSelected.length>=3){msg("🧬 3体まで！");return}if(selected>=n){msg("❌ 同じキャラの所持数が足りません");return}fusionSelected.push(b.name);renderFusionChoices()};box.appendChild(btn)}$("selectedInfo").textContent=fusionSelected.length+" / 3 選択中";$("doFusion").classList.toggle("ready",fusionSelected.length===3);$("doFusion").textContent=fusionSelected.length===3?"🧬 融合する！":"3体を選んでください"}
function doFusion(){if(fusionSelected.length!==3)return msg("🧬 3体選んでください");const used=[];let power=0,w={normal:1,gold:1,diamond:1,rainbow:1};for(const n of fusionSelected){const b=brains.find(x=>x.name===n);if(!b||b.rarity==="og")return msg("❌ OGは融合素材にできません");const opts=Object.keys(mutations).filter(m=>count(b,m)>0);const m=opts.sort((a,z)=>mutations[z].mult-mutations[a].mult)[0];used.push([b,m]);power+=b.income*mutations[m].mult;w[m]+=2}for(const [b,m] of used){const k=key(b.name,m);if(--mutCollection[k]<=0)delete mutCollection[k]}const allSecret=used.every(([b])=>b.rarity==="secret");if(allSecret&&Math.random()<0.0000005){const ogs=brains.filter(b=>b.rarity==="og");const og=ogs[Math.floor(Math.random()*ogs.length)];add(og,"normal");discovered[og.name]=true;fusionSelected=[];save();update();renderFusionChoices();$("fusionResult").innerHTML=`👑✨ 秘密の融合成功！<br>${og.icon} ${og.name}`;rareEffect(og);return}let pool=[];if(power>=10000)pool.push(...brains.filter(b=>b.rarity==="fusionsecret"));if(power>=5000)pool.push(...brains.filter(b=>b.rarity==="fusiongod"));if(power>=700)pool.push(...brains.filter(b=>b.rarity==="epic"));if(power>=300)pool.push(...brains.filter(b=>b.rarity==="fusionrare"));pool.push(brains.find(b=>b.rarity==="fusioncommon"));if(fusionLuck&&power>=5000)pool.push(...brains.filter(b=>b.rarity==="fusiongod"));if(fusionLuck&&power>=10000)pool.push(...brains.filter(b=>b.rarity==="fusionsecret"));const result=pool[Math.floor(Math.random()*pool.length)]||brains.find(b=>b.rarity==="fusioncommon");let sum=Object.values(w).reduce((a,b)=>a+b,0),r=Math.random()*sum,m="normal";for(const x in w){r-=w[x];if(r<=0){m=x;break}}add(result,m);discovered[result.name]=true;fusionSelected=[];save();update();renderFusionChoices();$("fusionResult").innerHTML=`🧬 パワー ${power.toLocaleString()} / ✨ ${mutations[m].icon} ${result.name}・${mutations[m].name}`;msg("🧬 融合成功！")}
async function pushLive(data){const fb=window.brainRoadFirebase;if(!fb)return msg("Firebase未接続");try{await fb.setDoc(fb.doc(fb.db,"gameConfig","live"),{...data,eventId:Date.now().toString()},{merge:true});msg("🌐 全員にリアルタイム反映")}catch(e){console.error(e);msg("❌ Firebase保存失敗")}}
function setupRealtime(){const fb=window.brainRoadFirebase;if(!fb)return;const ref=fb.doc(fb.db,"gameConfig","live");fb.onSnapshot(ref,s=>{if(!s.exists())return;const d=s.data();if(typeof d.luckyEnabled==="boolean")luckyEnabled=d.luckyEnabled;if(Number.isFinite(d.luckyMultiplier))luckyMultiplier=Math.max(1,Number(d.luckyMultiplier));if(typeof d.fusionLuck==="boolean")fusionLuck=d.fusionLuck;if(typeof d.goldBoost==="boolean")goldBoost=d.goldBoost;if(typeof d.diamondBoost==="boolean")diamondBoost=d.diamondBoost;if(typeof d.rainbowBoost==="boolean")rainbowBoost=d.rainbowBoost;update();if(!firebaseLiveStarted){lastRealtimeEventId=d.eventId||null;firebaseLiveStarted=true;return}if(d.eventId&&d.eventId!==lastRealtimeEventId&&d.spawn){lastRealtimeEventId=d.eventId;const b=brains.find(x=>x.name===d.spawn.name);if(b&&gameStarted)spawnBrain(b,d.spawn.mutation||"normal")}if(d.message)msg("📢 "+d.message)},console.error)}
function adminUI(){$("rareToggle").textContent=luckyEnabled?"ON":"OFF";$("rareToggle").classList.toggle("active",luckyEnabled);$("rareMultiplier").value=luckyMultiplier;[["fusionLuckToggle",fusionLuck],["goldBoostToggle",goldBoost],["diamondBoostToggle",diamondBoost],["rainbowBoostToggle",rainbowBoost],["realtimeToggle",realtimeAll]].forEach(([id,v])=>{const e=$(id);if(e){e.textContent=v?"ON":"OFF";e.classList.toggle("active",v)}});$("reverseInfo").textContent=reverseCount+" / 10"}
function setupSpawn(){const s=$("forceSpawnSelect");for(const b of brains.filter(x=>x.chance>0||x.rarity==="og")){const o=document.createElement("option");o.value=b.name;o.textContent=b.icon+" "+b.name+" / "+b.label;s.appendChild(o)}}
$("startGameButton").onclick=()=>{gameStarted=true;$("startMusic").style.display="none";try{audio();if(!musicOn)toggleMusic()}catch(e){}spawnBrain();if(!spawnTimer)spawnTimer=setInterval(()=>spawnBrain(),1000);if(!incomeTimer)incomeTimer=setInterval(()=>{const i=totalIncome()*(reverseCount+1);if(i){money+=i;update();save()}},1000)}
$("musicButton").onclick=toggleMusic;$("fusionOpen").onclick=openFusion;$("closeFusion").onclick=()=>$("fusionPanel").style.display="none";$("doFusion").onclick=doFusion;$("adminButton").onclick=()=>$("adminPanel").style.display="block";$("closeAdmin").onclick=()=>$("adminPanel").style.display="none";
$("rareToggle").onclick=()=>{luckyEnabled=!luckyEnabled;adminUI();update();save();pushLive({luckyEnabled,luckyMultiplier})};$("rareMultiplier").onchange=()=>{luckyMultiplier=Number($("rareMultiplier").value)||1;adminUI();update();save();pushLive({luckyEnabled,luckyMultiplier})};
$("fusionLuckToggle").onclick=()=>{fusionLuck=!fusionLuck;adminUI();save();if(realtimeAll)pushLive({fusionLuck})};$("goldBoostToggle").onclick=()=>{goldBoost=!goldBoost;adminUI();save();if(realtimeAll)pushLive({goldBoost})};$("diamondBoostToggle").onclick=()=>{diamondBoost=!diamondBoost;adminUI();save();if(realtimeAll)pushLive({diamondBoost})};$("rainbowBoostToggle").onclick=()=>{rainbowBoost=!rainbowBoost;adminUI();save();if(realtimeAll)pushLive({rainbowBoost})};$("realtimeToggle").onclick=()=>{realtimeAll=!realtimeAll;adminUI();msg(realtimeAll?"🌐 全員リアルタイムON":"👤 自分だけモード")};$("sendAdminChat").onclick=()=>{const text=$("adminChatInput").value.trim();if(text)pushLive({message:text})};$("forceOG").onclick=()=>{const b=brains.find(x=>x.name===$("ogSpawnSelect").value);if(b){spawnBrain(b,"normal");if(realtimeAll)pushLive({spawn:{name:b.name,mutation:"normal"}})}};$("reverseButton").onclick=()=>{if(reverseCount>=10)return msg("🔄 リバースは最大10回です");const costs=[500000,2500000,15000000,120000000,2030000000,24060000000,102000000000,510000000000,1500000000000,3000000000000];const cost=costs[reverseCount];if(money<cost)return msg("💸 リバースには "+cost.toLocaleString()+"円必要！");if(!confirm("リバースすると所持金・所持キャラ・変異キャラが消えます。図鑑は残ります。実行しますか？"))return;money=500;mutCollection={};reverseCount++;save();update();adminUI();msg("🔄 リバース成功！ "+reverseCount+"/10")};
$("addMoney").onclick=()=>{money+=Math.max(0,Math.floor(Number($("moneyAdd").value)||0));$("moneyAdd").value="";update();save()};$("forceSpawn").onclick=()=>{const b=brains.find(x=>x.name===$("forceSpawnSelect").value);if(b)spawnBrain(b,"normal")};
$("forceGlobalSpawn").onclick=()=>{const b=brains.find(x=>x.name===$("forceSpawnSelect").value),m=$("forceMutation").value;if(b)pushLive({spawn:{name:b.name,mutation:m},message:`${mutations[m].icon} ${b.name} / ${mutations[m].name} 出現！`})};
$("charTab").onclick=()=>{$("charTab").classList.add("active");$("mutTab").classList.remove("active");renderCollection()};$("mutTab").onclick=()=>{$("mutTab").classList.add("active");$("charTab").classList.remove("active");renderCollection()};
$("encyclopediaOpen").onclick=()=>{$("bookPanel").style.display="block";renderBook()};$("closeBook").onclick=()=>$("bookPanel").style.display="none";$("bookCharTab").onclick=()=>{$("bookCharTab").classList.add("active");$("bookMutTab").classList.remove("active");renderBook()};$("bookMutTab").onclick=()=>{$("bookMutTab").classList.add("active");$("bookCharTab").classList.remove("active");renderBook()};
$("resetButton").onclick=()=>{if(confirm("データをリセットしますか？")){localStorage.removeItem("brainRoadIntegratedSave");location.reload()}}
load();update();adminUI();setupSpawn();const ogs=$("ogSpawnSelect");if(ogs){for(const b of brains.filter(x=>x.rarity==="og")){const o=document.createElement("option");o.value=b.name;o.textContent=b.icon+" "+b.name;ogs.appendChild(o)}}setupRealtime();setTimeout(()=>{if(!gameStarted){$("startGameButton").click()}},100);
