/* ===== Firebase リアルタイム機能 ===== */

let firebaseLiveStarted = false;
let lastRealtimeEventId = null;

function setupRealtime(){

  const fb = window.brainRoadFirebase;

  if(!fb) return;

  const liveRef =
    fb.doc(
      fb.db,
      "gameConfig",
      "live"
    );

  fb.onSnapshot(
    liveRef,
    snapshot => {

      if(!snapshot.exists())
        return;

      const data = snapshot.data();

      /* レア率をリアルタイム反映 */

      if(typeof data.luckyEnabled === "boolean")
        luckyEnabled = data.luckyEnabled;

      if(Number.isFinite(data.luckyMultiplier))
        luckyMultiplier =
          Math.max(
            1,
            Number(data.luckyMultiplier)
          );

      update();

      /*
       * 最初に読み込んだスポーン命令は実行しない。
       * 後から届いた命令だけ実行する。
       */

      if(!firebaseLiveStarted){

        lastRealtimeEventId =
          data.eventId || null;

        firebaseLiveStarted = true;

        return;
      }

      /* 新しい全員向けスポーン */

      if(
        data.eventId &&
        data.eventId !== lastRealtimeEventId &&
        data.spawn
      ){

        lastRealtimeEventId =
          data.eventId;

        const brain =
          brains.find(
            b => b.name === data.spawn.name
          );

        if(brain)
          spawnBrain(brain);
      }

      /* 全員向けメッセージ */

      if(data.message){

        showMessage(
          "📢 " + data.message
        );

      }

    },
    error => {

      console.error(
        "Firebase realtime error:",
        error
      );

    }
  );

}
const $=id=>document.getElementById(id);

function load(){
try{
 const s=JSON.parse(
   localStorage.getItem("brainRoadIntegratedSave")||"null"
 );

 if(s){
   if(Number.isFinite(s.money))money=s.money;
   if(s.collection)collection=s.collection;
   if(typeof s.luckyEnabled==="boolean")
     luckyEnabled=s.luckyEnabled;
   if(Number.isFinite(s.luckyMultiplier))
     luckyMultiplier=Math.max(1,s.luckyMultiplier);
 }
}catch(e){}
}

function save(){
localStorage.setItem(
 "brainRoadIntegratedSave",
 JSON.stringify({
   money,
   collection,
   luckyEnabled,
   luckyMultiplier
 })
);
}

function update(){
$("money").textContent=
 "💰 "+money.toLocaleString()+"円";

let income=0;

for(const name in collection){
 const b=brains.find(x=>x.name===name);

 if(b)
   income+=b.income*collection[name];
}

$("income").textContent=
 "+"+income.toLocaleString()+"円/秒";

$("luckyStatus").textContent=
 luckyEnabled?
 "🍀 レア率 ×"+luckyMultiplier:
 "";

$("luckyStatus").classList.toggle(
 "active",
 luckyEnabled&&luckyMultiplier>1
);

renderCollection();
}

function renderCollection(){

const cards=$("cards");

cards.innerHTML="";

for(const b of brains){

 const n=collection[b.name]||0;

 if(!n)continue;

 const c=document.createElement("div");

 c.className="card";

 c.innerHTML=
 '<div class="icon">'+b.icon+'</div>'+
 '<div>'+b.name+'</div>'+
 '<div class="rarityText">'+b.label+'</div>'+
 '<div>×'+n+
 " / +"+
 b.income.toLocaleString()+
 "円/秒</div>";

 cards.appendChild(c);
}

if(!cards.children.length){

 cards.innerHTML=
 '<div style="grid-column:1/-1;text-align:center;padding:12px;color:#aaa">'+
 'まだ持っていません'+
 '</div>';

}
}

function audio(){

if(!audioContext)
 audioContext=
  new(window.AudioContext||window.webkitAudioContext)();

if(audioContext.state==="suspended")
 audioContext.resume();

}

function tone(
 freq,
 duration,
 type="sine",
 volume=.06
){

if(!audioContext)return;

const o=
 audioContext.createOscillator();

const g=
 audioContext.createGain();

o.type=type;
o.frequency.value=freq;

g.gain.setValueAtTime(
 volume,
 audioContext.currentTime
);

g.gain.exponentialRampToValueAtTime(
 .001,
 audioContext.currentTime+duration
);

o.connect(g);
g.connect(audioContext.destination);

o.start();
o.stop(
 audioContext.currentTime+duration
);

}

audio();

tone(660,.08);

setTimeout(
 ()=>tone(880,.12),
 70
);

}

audio();

tone(180,.25,"sawtooth",.15);

setTimeout(
 ()=>tone(280,.25,"square",.13),
 150
);

setTimeout(
 ()=>tone(420,.35),
 300
);

setTimeout(
 ()=>tone(700,.5),
 500
);

}

function secretSound(){

audio();

tone(330,.15);

setTimeout(
 ()=>tone(494,.15),
 120
);

setTimeout(
 ()=>tone(659,.15),
 240
);

setTimeout(
 ()=>tone(988,.25),
 360
);

setTimeout(
 ()=>tone(1318,.5),

);

}

function musicLoop(){

if(!musicOn)return;

const notes=[
  261.63,
  329.63,
  392,
  523.25,
  392,
  329.63
];

let i=0;

musicTimer=setInterval(
 ()=>{
   if(musicOn)
     tone(
       notes[i++%notes.length],
       .18,
       "triangle",
       .03
     );
 },
 260
);

}

function toggleMusic(){

audio();

musicOn=!musicOn;

if(musicTimer){
 clearInterval(musicTimer);
 musicTimer=null;
}

if(musicOn){

 musicLoop();

 $("musicButton").textContent=
  "🎵 BGM ON";

}else{

function flash(){

const f=$("flash");

f.classList.remove("flash");

void f.offsetWidth;

f.classList.add("flash");

}

function showMessage(text){

$("message").textContent=text;

setTimeout(
 ()=>{
   if($("message").textContent===text)
     $("message").textContent="";
 },
 1400
);

}

function rareEffect(data){

const e=$("effect");

if(
 data.rarity==="secret"||
 data.rarity==="fusionsecret"
){

 e.innerHTML=
  "🔴✨<br>SECRET!!<br>"+
  data.icon+
  " "+
  data.name+
  " 出現！！✨";

 e.className="showSecret";

 secretSound();

 flash();

}else if(
 data.rarity==="brainrotgod"||
 data.rarity==="fusiongod"
){

 e.innerHTML=
  "🟠⚡<br>BRAINROT GOD!!<br>"+
  data.icon+
  " "+
  data.name+
  " 出現！！";

 e.className="showGod";

 godSound();

 flash();

}

setTimeout(
 ()=>{
   e.className="";
   e.innerHTML="";
 },
 1900
);

}

/* レア率UPは「レア以上全体」の重みを倍率化。Secretも含む。 */

function chooseBrain(){

let total=0;

for(const b of brains){

 if(b.chance<=0)continue;

 let w=b.chance;

 if(
   luckyEnabled&&
   rarityRank[b.rarity]>=1
 )
   w*=luckyMultiplier;

 total+=w;
}

let r=Math.random()*total;

for(const b of brains){

 if(b.chance<=0)continue;

 let w=b.chance;

 if(
   luckyEnabled&&
   rarityRank[b.rarity]>=1
 )
   w*=luckyMultiplier;

 r-=w;

 if(r<=0)
   return b;

}

return brains[0];

}

function spawnBrain(forced=null){

if(!gameStarted)return;

const data=
 forced||chooseBrain();

const el=
 document.createElement("div");

el.className=
 "brain "+
 rarityClass(data);

el.innerHTML=
 '<span class="price">💰 '+
 data.price.toLocaleString()+
 '円</span>'+
 '<span class="label">'+
 '<span class="name">'+
 data.name+
 '</span>'+
 '<span class="rarity">'+
 data.label+
 '</span>'+
 '</span>'+
 '<span>'+
 data.icon+
 '</span>';

let x=-120;

el.style.left=
 x+"px";

$("game").appendChild(el);

if(
 data.rarity==="brainrotgod"||
 data.rarity==="secret"
)
 rareEffect(data);

let dead=false;

function move(){

 if(!el.isConnected||dead)
   return;

 x+=2.2;

 el.style.left=
  x+"px";

 if(x>innerWidth+120){

   dead=true;

   el.remove();

   return;
 }

 requestAnimationFrame(move);

}

function buy(){

audio();

if(dead||!el.isConnected)
 return;

if(money<data.price){

 showMessage(
  "💸 "+
  data.name+
  " は "+
  data.price.toLocaleString()+
  "円 必要！"
 );

 return;
}

money-=data.price;

collection[data.name]=
 (collection[data.name]||0)+1;

dead=true;

el.remove();

purchaseSound();

showMessage(
 data.icon+
 " "+
 data.name+
 " GET！"
);

update();

save();

}

el.addEventListener(
 "click",
 buy
);

el.addEventListener(
 "touchstart",
 e=>{
   e.preventDefault();
   buy();
 },
 {passive:false}
);

requestAnimationFrame(move);

}


/* ===== 融合 ===== */

function openFusion(){

fusionSelected=[];

$("fusionPanel").style.display=
 "block";

$("fusionResult").textContent="";

renderFusionChoices();

}

function closeFusion(){

$("fusionPanel").style.display=
 "none";

fusionSelected=[];

}

function renderFusionChoices(){

const box=$("fusionChoices");

box.innerHTML="";

for(const b of brains){

 if(!collection[b.name])
   continue;

 const btn=
  document.createElement("button");

 btn.className=
  "fusionChoice"+
  (
   fusionSelected.includes(b.name)
    ?" selected"
    :""
  );

 btn.innerHTML=
  b.icon+
  " "+
  b.name+
  "<br><small>"+
  b.label+
  " / 所持 ×"+
  collection[b.name]+
  " / +"+
  b.income.toLocaleString()+
  "円/秒</small>";

 btn.onclick=
  ()=>toggleFusion(b.name);

 box.appendChild(btn);

}

$("selectedInfo").textContent=
 fusionSelected.length+
 " / 3 選択中";

if(fusionSelected.length===3){

 $("doFusion").classList.add(
  "ready"
 );

 $("doFusion").textContent=
  "🧬 融合する！";

}else{

 $("doFusion").classList.remove(
  "ready"
 );

 $("doFusion").textContent=
  "3体を選んでください";

}

}

function toggleFusion(name){

if(fusionSelected.includes(name)){

 fusionSelected=
  fusionSelected.filter(
   x=>x!==name
  );

}else{

 if(fusionSelected.length>=3){

   showMessage(
    "🧬 3体まで選べます！"
   );

   return;
 }

 if(!collection[name])
   return;

 fusionSelected.push(name);

}

renderFusionChoices();

}


/*
 融合パワー =
 選んだ3体の毎秒収入の合計。

 5000以上でBrainrotGod候補、
 10000以上でSecret候補。

 管理パネルのレア率UPは融合結果にも反映。
*/

function doFusion(){

if(fusionSelected.length!==3){

 $("fusionResult").textContent=
  "🧬 必ず3体選んでください！";

 return;
}

let power=0;

const selectedData=[];

for(const name of fusionSelected){

 const b=
  brains.find(
   x=>x.name===name
  );

 if(
   !b||
   !collection[name]
 ){

   showMessage(
    "❌ 所持数が足りません"
   );

   return;
 }

 selectedData.push(b);

 power+=b.income;

}


/* 消費 */

for(const name of fusionSelected){

 collection[name]--;

 if(collection[name]<=0)
   delete collection[name];

}


/* 融合限定の最低ライン */

let pool=[];

if(power>=10000){

 pool.push(
  brains.find(
   b=>b.rarity==="fusionsecret"
  )
 );

}

if(power>=5000){

 pool.push(
  brains.find(
   b=>b.rarity==="fusiongod"
  )
 );

}

if(power>=700){

 pool.push(
  brains.find(
   b=>b.rarity==="epic"
  )
 );

}

if(power>=300){

 pool.push(
  brains.find(
   b=>b.rarity==="fusionrare"
  )
 );

}

if(power>=100){

 pool.push(
  brains.find(
   b=>b.rarity==="fusionrare"
  )
 );

}

pool.push(
 brains.find(
  b=>b.rarity==="fusioncommon"
 )
);


/* レア率UPがONなら高レア候補を追加して出やすくする */

let candidates=
 pool.filter(Boolean);

let weighted=[];

for(const b of candidates){

 let w=1;

 if(
   luckyEnabled&&
   rarityRank[b.rarity]>=1
 )
   w*=luckyMultiplier;

 if(
   b.rarity==="fusionsecret"&&
   power<10000
 )
   w=0;

 if(
   (
    b.rarity==="fusiongod"||
    b.rarity==="brainrotgod"
   )&&
   power<5000
 )
   w=0;

 for(
   let i=0;
   i<w;
   i++
 )
   weighted.push(b);

}

if(!weighted.length)
 weighted=[
  brains.find(
   b=>b.name==="トイレットペーパー脳"
  )
 ];

let result=
 weighted[
  Math.floor(
   Math.random()*weighted.length
  )
 ];


/* 10000以上はSecretを狙えるが、Secretだけに固定しない */

if(power>=10000){

 const secretChance=
  luckyEnabled?
   Math.min(
    .95,
    .35*luckyMultiplier
   ):
   .35;

 if(
   Math.random()<
   secretChance
 )
   result=
    brains.find(
     b=>b.rarity==="fusionsecret"
    );

}else if(power>=5000){

 const godChance=
  luckyEnabled?
   Math.min(
    .95,
    .35*luckyMultiplier
   ):
   .35;

 if(
   Math.random()<
   godChance
 )
   result=
    brains.find(
     b=>b.rarity==="fusiongod"
    );

}

collection[result.name]=
 (collection[result.name]||0)+1;

fusionSelected=[];

save();

update();

renderFusionChoices();

$("fusionResult").innerHTML=
 "🧬 融合パワー <strong>"+
 power.toLocaleString()+
 "円/秒</strong><br>"+
 "✨ "+
 result.icon+
 " "+
 result.name+
 " が誕生！";

showMessage(
 "🧬 融合成功！ "+
 result.name+
 " GET！"
);

if(
 result.rarity==="fusiongod"||
 result.rarity==="fusionsecret"
)
 rareEffect(result);

}

brains

/* ===== ゲーム開始 ===== */

$("startGameButton").onclick=()=>{

  /*
   音声の初期化でエラーが出ても、
   ゲーム開始そのものは止めない
  */

  gameStarted=true;

  $("startMusic").style.display=
    "none";

  $("musicButton").textContent=
    "🎵 BGM ON";

  try{

    audio();

    musicOn=true;

    musicLoop();

  }catch(e){

    musicOn=false;

    $("musicButton").textContent=
      "🔇 BGM OFF";

  }

  spawnBrain();

  if(!spawnTimer){

    spawnTimer=
      setInterval(
        ()=>spawnBrain(),
        1000
      );

  }

  if(!incomeTimer){

    incomeTimer=
      setInterval(
        ()=>{

          let inc=0;

          for(
            const name in collection
          ){

            const b=
              brains.find(
                x=>x.name===name
              );

            if(b)
              inc+=
                b.income*
                collection[name];

          }

          if(inc){

            money+=inc;

            update();

            save();

          }

        },
        1000
      );

  }

};

$("musicButton").onclick=
 toggleMusic;

$("fusionOpen").onclick=
 openFusion;

$("closeFusion").onclick=
 closeFusion;

$("doFusion").onclick=
 doFusion;

$("adminButton").onclick=
 openAdmin;

$("closeAdmin").onclick=
 closeAdmin;

$("rareToggle").onclick=()=>{

 luckyEnabled=
  !luckyEnabled;

 updateAdminUI();

 update();

 save();

 logAdmin(
  luckyEnabled?
   "🍀 レア率UPをONにしました":
   "🍀 レア率UPをOFFにしました"
 );

};

$("rareMultiplier").onchange=()=>{

 luckyMultiplier=
  Math.max(
   1,
   Number(
    $("rareMultiplier").value
   )||1
  );

 update();

 save();

 logAdmin(
  "🍀 レア率を×"+
  luckyMultiplier+
  "に変更"
 );

};

$("addMoney").onclick=()=>{

 const n=
  Math.max(
   0,
   Math.floor(
    Number(
     $("moneyAdd").value
    )||0
   )
  );

 money+=n;

 $("moneyAdd").value="";

 update();

 save();

 logAdmin(
  "💰 "+
  n.toLocaleString()+
  "円追加"
 );

};

$("forceSpawn").onclick=()=>{

 const b=
  brains.find(
   x=>x.name===
   $("forceSpawnSelect").value
  );

 if(b){

   spawnBrain(b);

   logAdmin(
    b.icon+
    " "+
    b.name+
    " を出現させました"
   );

 }

};

$("resetButton").onclick=()=>{

 if(
  !confirm(
   "所持金・コレクション・管理設定をすべてリセットしますか？"
  )
 )
   return;

 localStorage.removeItem(
  "brainRoadIntegratedSave"
 );

 money=500;

 collection={};

 luckyEnabled=false;

 luckyMultiplier=1;

 update();

 save();

 logAdmin(
  "データをリセットしました"
 );

};

load();

update();

setupForceSpawn();

updateAdminUI();

</script>
