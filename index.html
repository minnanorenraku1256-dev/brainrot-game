<style>

@keyframes god{0%{opacity:0;transform:scale(.3)}20%{opacity:1;transform:scale(1.25)}70%{opacity:1}100%{opacity:0;transform:scale(1.5)}}

#startMusic{position:absolute;inset:0;background:rgba(0,0,0,.88);z-index:999999;display:flex;align-items:center;justify-content:center}

{name:"虹色脳",icon:"🌈",rarity:"secret",chance:.012,price:5000000,income:100000},
{name:"ドラゴン脳",icon:"🐲",rarity:"secret",chance:.006,price:10000000,income:200000}
];
const fusionBrains=[
{name:"トイレットペーパー脳",icon:"🧻",rarity:"fusion_common",price:1000,income:35},
{name:"人脳",icon:"👦",rarity:"fusion_rare",price:5000,income:180},
{name:"サングラス脳",icon:"🕶️",rarity:"fusion_rare",price:8000,income:220},
{name:"クロノ・キング脳",icon:"👑",rarity:"fusion_brainrotgod",price:50000,income:5500},
{name:"アブソリュート脳",icon:"♾️",rarity:"fusion_secret",price:100000,income:15000}
];
let money=500;
let collection={};
let luckyMultiplier=1;
let audioContext=null;
let musicTimer=null;
let musicOn=false;

function audio(){
if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();
if(audioContext.state==="suspended")audioContext.resume();
}

function tone(freq,duration,type="sine",volume=.08){
if(!audioContext)return;
const o=audioContext.createOscillator();
const g=audioContext.createGain();
o.type=type;
o.frequency.value=freq;
g.gain.setValueAtTime(volume,audioContext.currentTime);
g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);
o.connect(g);
g.connect(audioContext.destination);
o.start();
o.stop(audioContext.currentTime+duration);
}

function purchaseSound(){
audio();
tone(660,.08);
setTimeout(()=>tone(880,.12),70);
}

function godSound(){
audio();
tone(180,.25,"sawtooth",.15);
setTimeout(()=>tone(280,.25,"square",.13),150);
setTimeout(()=>tone(420,.35,"sine",.16),300);
setTimeout(()=>tone(700,.5,"sine",.12),500);
}

function secretSound(){
audio();
tone(330,.15,"sine",.14);
setTimeout(()=>tone(494,.15,"sine",.14),120);
setTimeout(()=>tone(659,.15,"sine",.15),240);
setTimeout(()=>tone(988,.25,"sine",.18),360);
setTimeout(()=>tone(1318,.5,"sine",.15),520);
}

function musicLoop(){
if(!musicOn)return;
const notes=[261.63,329.63,392,523.25,392,329.63];
let i=0;
musicTimer=setInterval(()=>{
if(musicOn)tone(notes[i++%notes.length],.18,"triangle",.035);
},260);
}

function startGame(){
audio();
musicOn=true;
document.getElementById("startMusic").style.display="none";
document.getElementById("musicButton").textContent="🎵 BGM ON";
musicLoop();
}

function toggleMusic(){
audio();
musicOn=!musicOn;
if(musicTimer){
clearInterval(musicTimer);
musicTimer=null;
}
if(musicOn){
musicLoop();
document.getElementById("musicButton").textContent="🎵 BGM ON";
}else{
document.getElementById("musicButton").textContent="🔇 BGM OFF";
}
}

function chooseBrain(){
let total=0;

for(const b of brains){
let c=b.chance;
if(luckyMultiplier>1 &&
(b.rarity==="rare"||b.rarity==="epic"||
b.rarity==="brainrotgod"||b.rarity==="secret"))c*=luckyMultiplier;
total+=c;
}

let r=Math.random()*total;

for(const b of brains){
let c=b.chance;

if(luckyMultiplier>1 &&
(b.rarity==="rare"||b.rarity==="epic"||
b.rarity==="brainrotgod"||b.rarity==="secret"))c*=luckyMultiplier;

r-=c;
if(r<=0)return b;
}

return brains[0];
}

function rareEffect(data){
const e=document.getElementById("effect");

if(data.rarity==="secret"){
e.innerHTML="🔴✨<br>SECRET!!<br>"+data.icon+" "+data.name+" 出現！！✨";
e.className="showSecret";
secretSound();
flash();
}
else if(data.rarity==="brainrotgod"){
e.innerHTML="🟠⚡<br>BRAINROT GOD!!<br>"+data.icon+" "+data.name+" 出現！！";
e.className="showGod";
godSound();
flash();
}

setTimeout(()=>{
e.className="";
e.innerHTML="";
},1900);
}

function flash(){
const f=document.getElementById("flash");
f.classList.remove("flash");
void f.offsetWidth;
f.classList.add("flash");
}

function spawnBrain(forced=null){

const data=forced||chooseBrain();

const el=document.createElement("div");

el.className="brain "+data.rarity;

/* キャラ＋購入額を一つにまとめて表示 */
el.innerHTML=
'<span class="price">💰 '+data.price.toLocaleString()+'円</span>'+
'<span>'+data.icon+'</span>';

let x=-110;
el.style.left=x+"px";

document.getElementById("game").appendChild(el);

if(data.rarity==="brainrotgod"||data.rarity==="secret")rareEffect(data);

function move(){
if(!el.isConnected)return;
x+=2.2;
el.style.left=x+"px";

if(x>innerWidth+110){
el.remove();
return;
}

requestAnimationFrame(move);
}

function buy(){

audio();

if(!el.isConnected)return;

if(money<data.price){
showMessage("💸 "+data.name+" は "+data.price.toLocaleString()+"円 必要！");
return;
}

money-=data.price;
collection[data.name]=(collection[data.name]||0)+1;

el.remove();

purchaseSound();

showMessage(data.icon+" "+data.name+" GET！");
update();
save();
}

el.addEventListener("touchstart",e=>{
e.preventDefault();
buy();
},{passive:false});

el.addEventListener("click",buy);

requestAnimationFrame(move);
}

  let fusionSelected=[];

function openFusion(){
  fusionSelected=[];
  document.getElementById("fusionPanel").classList.add("open");
  renderFusionChoices();
  updateFusionSlots();
}

function closeFusion(){
  document.getElementById("fusionPanel").classList.remove("open");
}

function renderFusionChoices(){
  const box=document.getElementById("fusionChoices");
  box.innerHTML="";

  const names=Object.keys(collection);

  if(!names.length){
    box.innerHTML="<div>まだキャラを持っていません。</div>";
    return;
  }

  names.forEach(name=>{
    const data=brains.find(b=>b.name===name);
    if(!data)return;

    const button=document.createElement("button");
    button.className="fusionChoice";

    button.innerHTML=
      data.icon+" "+data.name+
      "<br>+"+data.income.toLocaleString()+"円/秒"+
      "<br>所持 ×"+collection[name];

    if(fusionSelected.includes(name)){
      button.classList.add("selected");
    }

    button.onclick=()=>toggleFusionChoice(name);

    box.appendChild(button);
  });
}

function toggleFusionChoice(name){
  const index=fusionSelected.indexOf(name);

  if(index>=0){
    fusionSelected.splice(index,1);
  }else{
    if(fusionSelected.length>=3){
      showMessage("🧬 融合には3体まで！");
      return;
    }

    if(!collection[name] || collection[name]<=0)return;

    fusionSelected.push(name);
  }

  updateFusionSlots();
  renderFusionChoices();
}

  function doFusion(){
  if(fusionSelected.length!==3){
    showMessage("🧬 必ず3体選んでください！");
    return;
  }

  const selectedData=fusionSelected
    .map(name=>brains.find(b=>b.name===name))
    .filter(Boolean);

  if(selectedData.length!==3)return;

  // 3体の稼ぎ額を合計
  const fusionPower=selectedData.reduce(
    (sum,b)=>sum+b.income,
    0
  );

  // 選んだ3体を1体ずつ消費
  for(const name of fusionSelected){
    if(!collection[name] || collection[name]<=0){
      showMessage("❌ キャラの所持数が足りません！");
      return;
    }
  }

  for(const name of fusionSelected){
    collection[name]--;

    if(collection[name]<=0){
      delete collection[name];
    }
  }

  // 融合パワーに応じて候補レアリティを決める
  let pool=[];

  if(fusionPower>=5000){
    pool=[
      ...brains.filter(b=>
        b.rarity==="rare"||
        b.rarity==="epic"||
        b.rarity==="brainrotgod"||
        b.rarity==="secret"
      ),
      ...fusionBrains
    ];
  }else if(fusionPower>=1000){
    pool=[
      ...brains.filter(b=>
        b.rarity==="rare"||
        b.rarity==="epic"
      ),
      ...fusionBrains.filter(b=>
        b.rarity==="fusion_common"||
        b.rarity==="fusion_rare"
      )
    ];
  }else{
    pool=[
      ...brains.filter(b=>
        b.rarity==="common"||
        b.rarity==="rare"
      ),
      fusionBrains[0],
      fusionBrains[1],
      fusionBrains[2]
    ];
  }

  // 融合パワーが高いほど、poolの後半＝上位キャラを選びやすくする
  const powerBonus=Math.min(fusionPower/5000,10);
  const weights=pool.map((b,index)=>{
    const progress=index/Math.max(pool.length-1,1);
    return 1+progress*powerBonus*8;
  });

  let totalWeight=weights.reduce((a,b)=>a+b,0);
  let random=Math.random()*totalWeight;
  let result=pool[0];

  for(let i=0;i<pool.length;i++){
    random-=weights[i];

    if(random<=0){
      result=pool[i];
      break;
    }
  }

  collection[result.name]=(collection[result.name]||0)+1;

  fusionSelected=[];
  updateFusionSlots();
  renderFusionChoices();
  update();
  save();

  showMessage(
    "🧬 "+result.icon+" "+result.name+
    " GET！"
  );

  // God / Secretなら特別演出
  if(
    result.rarity==="brainrotgod"||
    result.rarity==="secret"||
    result.rarity==="fusion_brainrotgod"||
    result.rarity==="fusion_secret"
  ){
    rareEffect({
      ...result,
      rarity:
        result.rarity==="fusion_brainrotgod"||
        result.rarity==="fusion_secret"
          ? result.rarity.replace("fusion_","")
          : result.rarity
    });
  }
}
  const slots=document.querySelectorAll(".fusionSlot");

  let totalIncome=0;

  slots.forEach((slot,index)=>{
    const name=fusionSelected[index];

    if(!name){
      slot.innerHTML=(index+1)+"<br>未選択";
      return;
    }

    const data=brains.find(b=>b.name===name);

    if(data){
      totalIncome+=data.income;
      slot.innerHTML=
        data.icon+"<br>"+
        data.name+"<br>"+
        "+"+data.income.toLocaleString()+"円/秒";
    }
  });

  document.getElementById("fusionPower").textContent=
    "融合パワー："+totalIncome.toLocaleString()+"円/秒";

  const button=document.getElementById("doFusionButton");

  button.disabled=fusionSelected.length!==3;

  button.textContent=
    fusionSelected.length===3
      ? "🧬 3体を融合！"
      : "🧬 あと"+(3-fusionSelected.length)+"体選択";
}
function showMessage(text){
const m=document.getElementById("message");
m.textContent=text;

setTimeout(()=>{
if(m.textContent===text)m.textContent="";
},1300);
}

function updateCollection(){

const cards=document.getElementById("cards");
const names=Object.keys(collection);

if(!names.length){
cards.textContent="まだ持っていません";
return;
}

cards.innerHTML="";

names.forEach(name=>{

const data=brains.find(b=>b.name===name);
if(!data)return;

const card=document.createElement("div");
card.className="card";

card.innerHTML=
'<div class="icon">'+data.icon+"</div>"+
"<div>"+data.name+"</div>"+
"<div>×"+collection[name]+"</div>"+
"<div>+"+data.income.toLocaleString()+"円/秒</div>";

cards.appendChild(card);
});
}

function update(){

document.getElementById("moneyText").textContent=money.toLocaleString();
updateCollection();

const status=document.getElementById("luckyStatus");

if(luckyMultiplier>1){
status.textContent="🍀 レア率 ×"+luckyMultiplier;
status.classList.add("active");
}else{
status.classList.remove("active");
}
}

function save(){
localStorage.setItem("brainRoadSave",JSON.stringify({
money,
collection,
luckyMultiplier
}));
}

function load(){

const saved=localStorage.getItem("brainRoadSave");

if(!saved)return;

try{

const d=JSON.parse(saved);

if(Number.isFinite(d.money))money=d.money;
if(d.collection)collection=d.collection;
if(d.luckyMultiplier)luckyMultiplier=d.luckyMultiplier;

}catch{}
}

function collectIncome(){

let income=0;

for(const name in collection){

const data=brains.find(b=>b.name===name);

if(data)income+=data.income*collection[name];
}

if(income>0){
money+=income;
update();
save();
}
}

load();
update();

spawnBrain();

setInterval(()=>spawnBrain(),1000);
setInterval(()=>collectIncome(),1000);
</script>

    <p>キャラを<strong>3体</strong>選んでください</p>

    <div id="fusionSlots">
      <div class="fusionSlot">①<br>未選択</div>
      <div class="fusionSlot">②<br>未選択</div>
